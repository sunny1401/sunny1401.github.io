<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sankranti Joshi, Senior Machine Learning Engineer at PlayStation and PhD researcher in Machine Learning and Geophysics at the University of Exeter." />
  <title>Sankranti Joshi | Senior Machine Learning Engineer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
      color: #111827;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .layout {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .profile {
      position: sticky;
      top: 2rem;
      width: 240px;
      flex-shrink: 0;
      background: #f3f4f6;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .profile h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .profile p {
      font-size: 0.9rem;
      color: #374151;
    }

    .links a {
      display: block;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .content {
      flex-grow: 1;
      min-width: 0;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-bottom: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
    }

    section {
      margin-top: 1rem;
    }

    h2 {
      color: #1f2937;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .collections {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 2rem;
    }

    .collection {
      margin: 0;
      padding: 1.25rem;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .collection h2 {
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
    }

    .collection h3 {
      font-size: 1rem;
      margin: 0.5rem 0;
    }

    .collection a {
      color: #2563eb;
    }

    .collection article + article {
      border-top: 1px solid #e5e7eb;
      margin-top: 1rem;
      padding-top: 1rem;
    }

    .collection p:last-child {
      margin-bottom: 0;
    }

    .empty-state,
    .collection time {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .button {
      background: #2563eb;
      color: #fff;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 6px;
      display: inline-block;
      margin-top: 1rem;
    }

    @media (max-width: 768px) {
      .collections {
        grid-template-columns: 1fr;
      }

      .layout {
        flex-direction: column;
        padding: 1rem;
      }

      .profile {
        position: static;
        width: 100%;
      }

      .content {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Left sticky profile -->
    <aside class="profile">
      <img src="assets/1713477330074.jpeg" alt="Sankranti Joshi" class="profile-pic" />
      <h1>Sankranti Joshi</h1>
      <p>Senior Machine Learning Engineer, PlayStation<br />PhD Researcher, University of Exeter</p>
      <p>Computer Vision · Multimodal Learning · Self-Supervised Learning · Agentic AI · MLOps</p>
      <div class="links">
        <a href="mailto:sunnyjoshi1401@gmail.com">Email</a>
        <a href="https://github.com/sunny1401" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://registry.opendata.aws/ssl4eo-multi-product-data/" target="_blank" rel="noopener noreferrer">Amazon Open Data</a>
      </div>
    </aside>

    <!-- Right content -->
    <main class="content">
      <nav aria-label="Main navigation">
        <!-- <a href="#projects">Projects</a> -->
        <!-- <a href="#blog">Blog</a> -->
        <!-- <a href="#papers">Papers</a> -->
        <a href="https://www.instagram.com/the.way.i.see.the.thing/">Photography</a>
        <a href="contact.html">Contact</a>
      </nav>

      <a href="assets/resume.pdf" download class="button">Download CV</a>

      <div class="collections">
        <!-- Projects: uncomment this section and its navigation link when content is ready.
        <section id="projects" class="collection" aria-labelledby="projects-heading">
          <h2 id="projects-heading">Projects</h2>
          <p class="empty-state">[under dev]</p>
        </section>
        -->

        <!-- Blog: uncomment this section and its navigation link when content is ready.
        <section id="blog" class="collection" aria-labelledby="blog-heading">
          <h2 id="blog-heading">Blog</h2>
          <p class="empty-state">No posts yet.</p>
        </section>
        -->

        <!-- Papers: uncomment this section and its navigation link when content is ready.
        <section id="papers" class="collection" aria-labelledby="papers-heading">
          <h2 id="papers-heading">Papers</h2>
          <p class="empty-state">No papers listed yet.</p>
        </section>
        -->
      </div>
    </main>
  </div>
</body>
</html>
